; ===========================================================================
; ScreenParams.example.ini  --  TEMPLATE, committed to git.
;
; Copy to  ScreenParams.ini  (gitignored).
;
; THIS FILE IS MACHINE-MANAGED. The application rewrites it on exit, on
; Finalize, and whenever "Set Calibration" is pressed. Do NOT hand-edit it
; while MHost2 is running - your change will be overwritten. Comments added
; here do survive (IniConfig round-trips them), but the values will not.
;
; Hand-written rig settings - screen geometry, deg2pix parameters, target
; windows - live in RigConfig.ini instead.
;
; WHY THIS FILE KEEPS ITS OLD NAME: the COMPILED RewardHandler reads
; [reward] from this exact path and cannot be rebuilt from source control,
; so the file must stay where it expects it.
; ===========================================================================

[eye calibration]
; Raw analog eye signal -> pixels:  pixel = raw * gain + offset
; Applied in classes/eyeinfo.m (geteye) and in MHost2 post-trial processing.
; Rewritten by MHost2.addnewoffsets whenever calibration is applied, and on
; app close.
xoffset=908
xgain=0.074
yoffset=628
ygain=0.076

[reward]
; Default manual reward duration in seconds. Mirrors the GUI field.
; Polled by the COMPILED RewardHandler for the physical reward button.
reward=1

[last filepaths]
; Remembered UI selections, rewritten on exit.
;   params  - parameter .m file defining targets and intervals
;   data    - root directory session folders are written into
;   tasks   - directory scanned by LiveParams to populate the trial-type table
;   trellis - directory Trellis writes neural recordings into
params=/home/gandhi/Documents/Experiment/Parameters/MyParameters.m
data=/home/gandhi/Documents/Data_default
tasks=/home/gandhi/Documents/Experiment/Tasks
trellis=/home/gandhi/Documents

[last eye calibration file]
; Name of the last calibration preset loaded by EyeCalibration.mlapp.
last_file=EyeCalibrationDefault.ini

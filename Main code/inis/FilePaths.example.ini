; ===========================================================================
; FilePaths.example.ini  --  TEMPLATE, committed to git.
;
; The real file is  FilePaths.ini , gitignored because paths differ per rig
; (rig1 uses /home/gandhi/..., rig2 uses /home/gandhilab/...).
; Copy to FilePaths.ini and set absolute paths for this machine.
; All values are absolute paths with NO trailing slash.
; ===========================================================================

[paths]
; Repo root "Main code" directory. Added to the MATLAB path with genpath by
; MHost2.startupFcn and by GraphicsHandler.
home = /home/gandhi/Documents/MATLAB/Gandhi-PsychToolboxMERGER/Gandhi-PsychToolbox/Main code

; Ripple xippmex install (ships with Trellis).
xippmex = /opt/Trellis/Tools/xippmex

; Directory GraphicsHandler.m lives in. NOTE: not currently read by any code -
; GraphicsHandler is launched via a hard-coded relative cd in startupFcn.
graphics = /home/gandhi/Documents/MATLAB/Gandhi-PsychToolboxMERGER/Gandhi-PsychToolbox/Main code/background_functions

; Absolute path to this rig's ScreenParams.ini. Read by GraphicsHandler.
ini_screen = /home/gandhi/Documents/MATLAB/Gandhi-PsychToolboxMERGER/Gandhi-PsychToolbox/Main code/inis/ScreenParams.ini

; MATLAB Runtime used by the compiled RewardHandler and SoundGenerator.
runtime = /usr/local/MATLAB/MATLAB_Runtime/R2024b

; Compiled helper launch scripts, started by MHost2.startupFcn in their own
; gnome-terminal tabs.
reward_handler = /usr/RewardHandler/application/run_RewardHandler.sh
sound_generator = /usr/SoundGenerator/application/run_SoundGenerator.sh

; Absolute path to this rig's RigConfig.ini (hand-written rig settings).
ini_config = /home/gandhi/Documents/MATLAB/Gandhi-PsychToolboxMERGER/Gandhi-PsychToolbox/Main code/inis/RigConfig.ini

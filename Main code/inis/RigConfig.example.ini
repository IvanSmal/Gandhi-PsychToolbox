; ===========================================================================
; RigConfig.example.ini  --  TEMPLATE, committed to git.
;
; Copy to  RigConfig.ini  (gitignored) and fill in values measured on THIS rig.
;
; This file is HAND-WRITTEN and hand-edited. The application never rewrites it,
; with one exception noted below, so comments and formatting are safe here.
;
; Machine-written values (eye calibration, reward duration, remembered UI
; paths) live in ScreenParams.ini instead - see that file's header.
; ---------------------------------------------------------------------------
; TERMINOLOGY (used throughout this project)
;   display  = the TV the ANIMAL looks at        (Psychtoolbox screen 1, gr.window_main)
;   monitor  = the screen the EXPERIMENTER sees  (Psychtoolbox screen 0, gr.window_monitor)
; Note: "stim" in this codebase means NEURAL stimulation (see @internal/stim.m),
; never the visual display - do not use it for display settings.
; ===========================================================================

[screen info]
; Physically MEASURED size of the DISPLAY's active area, in mm.
; Do not take these from EDID - TV EDID is frequently wrong (rig1's TV
; reports 160x90mm when it is really 1210x684). Read by ScreenInfo.mlapp.
width=1210
height=684

; Pixel resolution the DISPLAY is driven at.
xres=1920
yres=1080

; Background colour of both windows, normalised 0-1 as "R, G, B".
; Read by GraphicsHandler at startup.
background=0.14902, 0.14902, 0.14902

; --- Optional: force the display mode at GraphicsHandler startup ---
; Omit all three to leave the display mode untouched (correct when the panel
; already runs at its native mode - e.g. rig1's 1080p60 TV, which has no
; 120 Hz mode at all).
; Set all three when the panel must be driven at a non-native mode - e.g.
; rig2's 4K panel, forced to 1920x1080 @ 120 Hz.
; All three or none: a partial set is ignored.
; Read by GraphicsHandler -> Screen('Resolution', 1, ...).
; display_xres=1920
; display_yres=1080
; display_refresh=120

[for deg2pix]
; Eye-to-display distance in mm. Used by deg2pix / pix2deg.
subject distance=520

; Size of one pixel in mm  (= width / xres , height / yres).
xPixelSize=0.63021
yPixelSize=0.63333

; Pixel coordinate the animal fixates when looking straight ahead. This is NOT
; the geometric centre of the panel - it is set by eye height relative to the
; display. Changes only when the rig is physically reconfigured.
; The one value in this file the app can write: background_functions/
; FindTrueCenter.m offers to save a new centre, but only on an interactive
; y/n confirmation, never automatically.
true center=960  736

[target window parameters]
; Extra degrees added to a target's acceptance window per degree of
; eccentricity. 0 = fixed window everywhere. Read by internal.checkeye.
eccentricity_gain=2

; For moving targets, how far back in time (ms) the eye may lag the target and
; still count as on-target. Read by internal.checkeye.
trailing_window_time=100

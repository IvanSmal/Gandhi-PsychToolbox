; ===========================================================================
; ScreenParams.example.ini  --  TEMPLATE, committed to git.
;
; The real file is  ScreenParams.ini , which is gitignored because every rig
; has different geometry and calibration. Copy this file to ScreenParams.ini
; and fill in values measured on that rig.
;
; WARNING: several values below are REWRITTEN BY THE APP at runtime (marked
; [auto]). Do not hand-edit those while MHost2 is running - it will overwrite
; them on exit, on Finalize, and whenever "Set Calibration" is pressed.
; ===========================================================================

[screen info]
; Physically MEASURED size of the stimulus display's active area, in mm.
; Do not take these from EDID - TV EDID is frequently wrong (rig1's TV
; reports 160x90mm). Read by ScreenInfo.mlapp.
width=1210
height=684

; Pixel resolution the stimulus display is DRIVEN at.
xres=1920
yres=1080

; Background colour of both windows, normalised 0-1 as "R, G, B".
; Read by GraphicsHandler at startup.
background=0.14902, 0.14902, 0.14902

; --- Optional: force the stimulus display mode at GraphicsHandler startup ---
; Omit all three keys to leave the display mode untouched (correct when the
; panel already runs at its native mode - e.g. rig1's 1080p60 TV, which has
; no 120 Hz mode at all).
; Set all three when the panel must be driven at a non-native mode - e.g.
; rig2's 4K panel, which is forced to 1920x1080 @ 120 Hz.
; Read by GraphicsHandler -> Screen('Resolution', 1, ...).
; stim_xres=1920
; stim_yres=1080
; stim_refresh=120

[for deg2pix]
; Eye-to-screen distance in mm. Used by deg2pix / pix2deg.
subject distance=520

; Size of one pixel in mm  (= width / xres , height / yres).
xPixelSize=0.63021
yPixelSize=0.63333

; Pixel coordinate the animal fixates when looking straight ahead. This is
; NOT the geometric centre of the panel - it is set by eye height relative to
; the screen. Set it with background_functions/FindTrueCenter.m  [auto]
true center=960  736

[eye calibration]
; Raw analog eye signal -> pixels:  pixel = raw * gain + offset
; Applied in classes/eyeinfo.m (geteye) and in MHost2 post-trial processing.
; All four are rewritten by MHost2.addnewoffsets whenever calibration is
; applied, and on app close.  [auto]
xoffset=908
xgain=0.074
yoffset=628
ygain=0.076

[last eye calibration file]
; Name of the last calibration preset loaded by EyeCalibration.mlapp.  [auto]
last_file=EyeCalibrationDefault.ini

[reward]
; Default manual reward duration in seconds. Mirrors the GUI field and is
; polled by RewardHandler for the physical reward button.  [auto]
reward=1

[last filepaths]
; Remembered UI selections, rewritten on exit.  [auto]
; params  - parameter .m file defining targets and intervals
; data    - root directory session folders are written into
; tasks   - directory scanned by LiveParams to populate the trial-type table
; trellis - directory Trellis writes neural recordings into
params=/home/gandhi/Documents/Experiment/Parameters/MyParameters.m
data=/home/gandhi/Documents/Data_default
tasks=/home/gandhi/Documents/Experiment/Tasks
trellis=/home/gandhi/Documents

[target window parameters]
; Extra degrees added to a target's acceptance window per degree of
; eccentricity. 0 = fixed window everywhere. Read by internal.checkeye.
eccentricity_gain=2

; For moving targets, how far back in time (ms) the eye may lag the target
; and still count as on-target. Read by internal.checkeye.
trailing_window_time=100
